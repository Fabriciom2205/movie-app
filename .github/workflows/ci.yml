# CI/CD pipeline.
#
#   pull request:  app + database checks (no deploy)
#   push to main:  app + database checks -> migrate production DB -> deploy app
#
#  - app:      the app lints, type-checks and builds from a clean checkout
#  - database: all migrations build a fresh database, and every RLS test passes
#  - migrate:  apply new migrations to production (only if both checks passed)
#  - deploy:   deploy the app to Vercel production (only after migrate succeeded)
#
# Vercel's own automatic deploys are off for main (vercel.json), so this
# workflow is the only way code reaches production. PR previews stay automatic.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only need to read the code.
permissions:
  contents: read

# Pull requests: a newer push cancels the older, now-stale run.
# main: runs queue instead. Cancelling a run mid-migration could leave the
# production database half-changed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  database:
    name: Migrations + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (includes the Supabase CLI)
        run: npm ci

      # A throwaway Supabase in Docker, built from nothing but our migrations.
      # Keep Postgres + auth (our tables reference auth.users); skip the rest.
      - name: Start local Supabase and apply all migrations
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Lint database functions
        run: npx supabase db lint --local --schema public,private --level warning --fail-on error

      - name: Run RLS tests
        run: npm run test:db -- --local

  migrate:
    name: Migrate production database
    needs: [app, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (includes the Supabase CLI)
        run: npm ci

      # --project-ref instead of `supabase link`: link also saves API keys and
      # service settings for local development, which needs extra token
      # permissions this job has no use for.
      - name: Show pending migrations
        run: npx supabase db push --project-ref "$SUPABASE_PROJECT_REF" --dry-run

      - name: Apply migrations
        run: npx supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes

  deploy:
    name: Deploy app to production
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the Vercel CLI
        run: npm install --global vercel@62

      # Downloads the production settings and env vars (TMDB token, Supabase
      # keys) from Vercel, so the build uses exactly what production uses.
      - name: Pull production settings from Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
