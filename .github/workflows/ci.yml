# CI: on every push to main and every pull request,
#  - app:      the app lints, type-checks and builds from a clean checkout
#  - database: all migrations build a fresh database, and every RLS test passes
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  database:
    name: Migrations + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (includes the Supabase CLI)
        run: npm ci

      # A throwaway Supabase in Docker, built from nothing but our migrations.
      # Keep Postgres + auth (our tables reference auth.users); skip the rest.
      - name: Start local Supabase and apply all migrations
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Lint database functions
        run: npx supabase db lint --local --schema public,private --level warning --fail-on error

      - name: Run RLS tests
        run: npm run test:db -- --local
